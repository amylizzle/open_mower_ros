#footprint: [[x0, y0], [x1, y1], ... [xn, yn]]
robot_radius: 0.0

global_frame: map
robot_base_frame: base_link

plugins:
- name: static_layer
  type: costmap_2d::StaticLayer
- name: obstacle_layer
  type: costmap_2d::ObstacleLayer
- name: inflation_layer
  type: costmap_2d::InflationLayer

static_layer:
  map_topic: mower_map_service/map
obstacle_layer:
  max_obstacle_height: 1.0
  obstacle_range: 3.0
  raytrace_range: 4.0
  # All known obstacles, as a PointCloud2. Normally published by mower_comms_v2's
  # ObstacleServiceInterface, which collects firmware contacts (e.g. a bumper) and new obstacles
  # from /obstacles/new (camera, the simulator's sim_obstacles.py). Marking only - nothing provides
  # clearing data yet. With no publisher this source does nothing.
  #
  # Known limitation: these parameters are loaded into both costmaps. The local costmap rolls
  # with the robot, so its marks drop out of the window, but the global costmap does not: a
  # mark there (including a false positive, or an obstacle that has since been moved) stays
  # lethal, with the global inflation around it, until /move_base_flex/clear_costmaps is
  # called or move_base_flex restarts. Fix once real sensors exist: give this source clearing
  # data, or keep it out of the global costmap.
  observation_sources: obstacle_points
  obstacle_points:
    data_type: PointCloud2
    topic: /obstacles/points
    sensor_frame: base_link
    marking: true
    clearing: false
